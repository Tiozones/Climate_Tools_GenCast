<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kansas Mesonet Dashboard</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background-color: #2c2c2c; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        #map { width: 100%; height: 100vh; background-color: #2c2c2c; }
        
        /* Estilos do Popup do Leaflet */
        .leaflet-popup-content-wrapper { background: #1e1e1e; color: #ffffff; border-radius: 8px; border: 1px solid #ff3333; }
        .leaflet-popup-tip { background: #1e1e1e; border: 1px solid #ff3333; }
        .popup-title { color: #ff4d4d; font-size: 16px; margin: 0 0 5px 0; border-bottom: 1px solid #333; padding-bottom: 5px; }

        /* ==========================================
           ESTILOS DOS PAINÉIS FLUTUANTES
           ========================================== */
        .floating-panel {
            position: absolute;
            z-index: 9999; /* Garante que fique acima do mapa */
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(5px);
            border: 1px solid #444;
            border-radius: 10px;
            color: #fff;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Painel 1: Título e Lista (Canto Superior Esquerdo) */
        #title-panel {
            top: 20px;
            left: 20px;
            width: 280px;
        }
        #title-panel h2 { margin: 0 0 5px 0; font-size: 20px; color: #ffd700; }
        #title-panel p { margin: 0 0 15px 0; font-size: 13px; color: #ccc; }
        
        /* Botão para abrir a lista */
        .toggle-btn {
            background: #333; color: #fff; border: 1px solid #555;
            padding: 8px; width: 100%; border-radius: 5px;
            cursor: pointer; text-align: left; font-weight: bold;
            display: flex; justify-content: space-between;
        }
        .toggle-btn:hover { background: #444; }

        /* Lista de Estações Oculta */
        #station-list {
            display: none; /* Escondida por padrão */
            list-style: none; padding: 0; margin: 10px 0 0 0;
            max-height: 150px; overflow-y: auto;
        }
        #station-list li {
            padding: 8px; border-bottom: 1px solid #444; cursor: pointer; font-size: 14px;
        }
        #station-list li:hover { background: #444; color: #ffd700; }

        /* Painel 2: Busca por GPS (Canto Superior Direito) */
        #gps-panel {
            top: 20px;
            right: 20px;
            width: 220px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #gps-panel h3 { margin: 0; font-size: 16px; color: #fff; }
        .coord-input {
            background: #222; color: #fff; border: 1px solid #555;
            padding: 8px; border-radius: 5px; width: 100%; box-sizing: border-box;
        }
        .action-btn {
            background: #ffd700; color: #000; border: none; font-weight: bold;
            padding: 10px; border-radius: 5px; cursor: pointer;
        }
        .action-btn:hover { background: #e6c200; }
        
    </style>
</head>
<body>

    <!-- UI: PAINEL DE TÍTULO E LISTA -->
    <div id="title-panel" class="floating-panel">
        <h2>GenCast Mesonet</h2>
        <p>Selecione sua Mesonet station no mapa ou expanda a lista abaixo.</p>
        
        <button class="toggle-btn" onclick="toggleList()">
            Estações Disponíveis <span id="arrow">▼</span>
        </button>
        <ul id="station-list">
            <!-- Os itens chamam uma função para mover o mapa -->
            <li onclick="irParaEstacao('Manhattan')">📍 Manhattan</li>
            <li onclick="irParaEstacao('Colby')">📍 Colby</li>
            <li onclick="irParaEstacao('Parsons')">📍 Parsons</li>
        </ul>
    </div>

    <!-- UI: PAINEL DE BUSCA E GPS -->
    <div id="gps-panel" class="floating-panel">
        <h3>🔍 Coordenadas</h3>
        <input type="text" id="input-lat" class="coord-input" placeholder="Latitude (ex: 39.2)">
        <input type="text" id="input-lon" class="coord-input" placeholder="Longitude (ex: -96.5)">
        <button class="action-btn" onclick="buscarCoordenada()">Ir para Coordenada</button>
        <hr style="border: 0; border-top: 1px solid #555; width: 100%; margin: 5px 0;">
        <button class="action-btn" style="background: #007bff; color: white;" onclick="usarMeuGPS()">📡 Usar minha localização</button>
    </div>

    <!-- MAPA -->
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/aparshin/leaflet-boundary-canvas@master/src/BoundaryCanvas.js"></script>
    
    <script>
        // ==========================================
        // MAP SETUP & CLIPPING (Mantido igual)
        // ==========================================
        var kansasBounds = [[36.9, -102.1], [40.1, -94.5]];
        var map = L.map('map', { center: [38.5, -98.0], zoom: 7, minZoom: 7, maxBounds: kansasBounds, maxBoundsViscosity: 1.0 });

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles &copy; Esri', maxZoom: 19 }).addTo(map);

        fetch('https://raw.githubusercontent.com/PublicaMundi/MappingAPI/master/data/geojson/us-states.json')
            .then(response => response.json())
            .then(data => {
                var kansasFeature = data.features.find(f => f.properties.name === 'Kansas');
                var osmUrl = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
                L.TileLayer.boundaryCanvas(osmUrl, { boundary: kansasFeature, attribution: '&copy; OpenStreetMap' }).addTo(map);
                L.geoJSON(kansasFeature, { style: { color: '#ffd700', weight: 4, fill: false, opacity: 1 } }).addTo(map);
                adicionarEstacoes();
            });

        // ==========================================
        // LÓGICA DAS ESTAÇÕES
        // ==========================================
        // Guardamos as estações numa variável para podermos simular o clique nelas pela lista
        var markers = {}; 

        function adicionarEstacoes() {
            var markerStyle = { radius: 8, fillColor: "#ff0000", color: "#ffffff", weight: 2, opacity: 1, fillOpacity: 0.9 };
            
            markers['Manhattan'] = L.circleMarker([39.208, -96.592], markerStyle).addTo(map)
                .bindPopup('<h3 class="popup-title">Manhattan Mesonet</h3><b>Temp:</b> 22°C <br><b>Precip:</b> 0.0 mm');

            markers['Colby'] = L.circleMarker([39.395, -101.060], markerStyle).addTo(map)
                .bindPopup('<h3 class="popup-title">Colby Mesonet</h3><b>Temp:</b> 19°C <br><b>Precip:</b> 2.5 mm');

            markers['Parsons'] = L.circleMarker([37.370, -95.280], markerStyle).addTo(map)
                .bindPopup('<h3 class="popup-title">Parsons Mesonet</h3><b>Temp:</b> 25°C <br><b>Precip:</b> 0.0 mm');
        }

        // ==========================================
        // FUNÇÕES DA INTERFACE (UI)
        // ==========================================
        
        // 1. Abrir/Fechar Lista de Estações
        function toggleList() {
            var lista = document.getElementById("station-list");
            var seta = document.getElementById("arrow");
            if (lista.style.display === "none" || lista.style.display === "") {
                lista.style.display = "block";
                seta.innerHTML = "▲";
            } else {
                lista.style.display = "none";
                seta.innerHTML = "▼";
            }
        }

        // 2. Voar para estação ao clicar na lista
        function irParaEstacao(nome) {
            var marker = markers[nome];
            if(marker) {
                // Voa suavemente para o ponto e abre a caixinha de dados
                map.flyTo(marker.getLatLng(), 11);
                marker.openPopup();
            }
        }

        // 3. Buscar Coordenada digitada
        function buscarCoordenada() {
            var lat = parseFloat(document.getElementById("input-lat").value);
            var lon = parseFloat(document.getElementById("input-lon").value);
            
            if (!isNaN(lat) && !isNaN(lon)) {
                map.flyTo([lat, lon], 12);
                L.marker([lat, lon]).addTo(map).bindPopup("<b>Buscado:</b><br>" + lat + ", " + lon).openPopup();
            } else {
                alert("Por favor, insira números válidos para Latitude e Longitude.");
            }
        }

        // 4. Usar GPS do Usuário (Geolocalização Nativa)
        function usarMeuGPS() {
            if (navigator.geolocation) {
                // Pede permissão ao usuário e pega a posição
                navigator.geolocation.getCurrentPosition(function(position) {
                    var lat = position.coords.latitude;
                    var lon = position.coords.longitude;
                    
                    // Voa para o local do usuário e coloca um pino azul brilhante
                    map.flyTo([lat, lon], 13);
                    var userPino = L.circleMarker([lat, lon], {
                        radius: 10, fillColor: "#007bff", color: "#ffffff", weight: 3, opacity: 1, fillOpacity: 1
                    }).addTo(map).bindPopup("<b>Sua Localização Atual</b>").openPopup();
                    
                }, function(error) {
                    alert("Não foi possível acessar seu GPS. Verifique as permissões do navegador.");
                });
            } else {
                alert("Seu navegador não suporta Geolocalização.");
            }
        }
    </script>
</body>
</html>

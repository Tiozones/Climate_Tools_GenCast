<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kansas Mesonet Dashboard</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Importando o Plotly.js para gráficos científicos -->
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background-color: #2c2c2c; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        #map { width: 100%; height: 100vh; background-color: #2c2c2c; }
        
        /* Leaflet Popup Styles */
        .leaflet-popup-content-wrapper { background: #1e1e1e; color: #ffffff; border-radius: 8px; border: 1px solid #ff3333; }
        .leaflet-popup-tip { background: #1e1e1e; border: 1px solid #ff3333; }
        .popup-title { color: #ff4d4d; font-size: 16px; margin: 0 0 5px 0; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .popup-subtitle { color: #aaa; font-size: 12px; margin-bottom: 8px; }

        /* ==========================================
           FLOATING PANELS STYLES
           ========================================== */
        .floating-panel {
            position: absolute;
            z-index: 9999; 
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(5px);
            border: 1px solid #444;
            border-radius: 10px;
            color: #fff;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        #title-panel { top: 20px; left: 20px; width: 280px; }
        #title-panel h2 { margin: 0 0 5px 0; font-size: 20px; color: #ffd700; }
        #title-panel p { margin: 0 0 15px 0; font-size: 13px; color: #ccc; }
        
        .toggle-btn {
            background: #333; color: #fff; border: 1px solid #555;
            padding: 8px; width: 100%; border-radius: 5px;
            cursor: pointer; text-align: left; font-weight: bold;
            display: flex; justify-content: space-between;
        }
        .toggle-btn:hover { background: #444; }

        #station-list {
            display: none; 
            list-style: none; padding: 0; margin: 10px 0 0 0;
            max-height: 250px; overflow-y: auto;
        }
        #station-list li { padding: 8px; border-bottom: 1px solid #444; cursor: pointer; font-size: 14px; }
        #station-list li:hover { background: #444; color: #ffd700; }

        #gps-panel { top: 20px; right: 20px; width: 220px; display: flex; flex-direction: column; gap: 10px; }
        #gps-panel h3 { margin: 0; font-size: 16px; color: #fff; }
        
        .coord-input {
            background: #222; color: #fff; border: 1px solid #555;
            padding: 8px; border-radius: 5px; width: 100%; box-sizing: border-box;
        }
        
        .action-btn {
            background: #ffd700; color: #000; border: none; font-weight: bold;
            padding: 10px; border-radius: 5px; cursor: pointer;
        }
        .action-btn:hover { background: #e6c200; }

        #plot-panel {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 850px;
            display: none; /* hinding at firts */
            flex-direction: column;
        }
        .close-btn {
            align-self: flex-end;
            background: none;
            border: none;
            color: #ff4d4d;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- UI PANELS -->
    <div id="title-panel" class="floating-panel">

        <!-- LOGO CONTAINER -->
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px;">
            <!-- Active K-State Logo (White Version) -->
            <img src="university_logo_system_university_wordmark_white copy.jpg" alt="K-State Logo" style="max-height: 28px; width: auto; object-fit: contain;">
            
            <!-- Alternative K-State Logo (Black Version - Commented Out) -->
            <!-- <img src="university_logo_system_university_wordmark_black.jpg" alt="K-State Logo" style="max-height: 28px; width: auto; object-fit: contain;"> -->
            
            <!-- DART Logo -->
            <img src="DART Logo White Background.png" alt="DART Logo" style="max-height: 28px; width: auto; object-fit: contain; background: white; padding: 2px; border-radius: 4px;">
        </div>
        
        <h2>GenCast Mesonet</h2>
        <p>Select your Mesonet station on the map or expand the list below.</p>
        
        <button class="toggle-btn" onclick="toggleList()">
            Available Stations <span id="arrow">▼</span>
        </button>
        <!-- The list is now empty by default, it will be populated by the CSV -->
        <ul id="station-list"></ul>
    </div>

    <div id="gps-panel" class="floating-panel">
        <h3>🔍 Coordinates</h3>
        <input type="text" id="input-lat" class="coord-input" placeholder="Latitude (e.g. 39.2)">
        <input type="text" id="input-lon" class="coord-input" placeholder="Longitude (e.g. -96.5)">
        <button class="action-btn" onclick="searchCoordinates()">Find Nearest Station</button>
        <hr style="border: 0; border-top: 1px solid #555; width: 100%; margin: 5px 0;">
        <button class="action-btn" style="background: #007bff; color: white;" onclick="useMyLocation()">📡 Use my location</button>
    </div>

    <div id="plot-panel" class="floating-panel">
        <button class="close-btn" onclick="closeGraph()">X</button>
        <h3 style="margin-top: 0; color: #ffd700;" id="plot-title">Forecast Accuracy</h3>
        <p id="plot-feedback" style="font-size: 13px; line-height: 1.4; color: #ddd; margin-bottom: 15px;"></p>
        <div id="correlation-plot" style="width: 100%; height: 350px;"></div>
        <button class="action-btn" style="width: 200px; align-self: center; margin-top: 10px; font-size: 13px;" onclick="downloadChart()">💾 Download PNG</button>
    </div>
    <!-- MAP CONTAINER -->
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/aparshin/leaflet-boundary-canvas@master/src/BoundaryCanvas.js"></script>
    
    <script>
        // ==========================================
        // 1. MAP SETUP & CLIPPING
        // ==========================================
        var kansasBounds = [[36.9, -102.1], [40.1, -94.5]];
        
        var map = L.map('map', { 
            center: [38.5, -98.0], 
            zoom: 7, 
            minZoom: 7, 
            maxBounds: kansasBounds, 
            maxBoundsViscosity: 1.0,
            preferCanvas: true,
            zoomControl: false 
        });

        L.control.zoom({ position: 'bottomleft' }).addTo(map);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', { 
            attribution: 'Tiles &copy; Esri', maxZoom: 19 
        }).addTo(map);

        fetch('https://raw.githubusercontent.com/kjhealy/us-county/master/data/geojson/gz_2010_us_040_00_5m.json')
            .then(response => response.json())
            .then(data => {
                var kansasFeature = data.features.find(f => f.properties.NAME === 'Kansas');
                var osmUrl = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
                
                L.TileLayer.boundaryCanvas(osmUrl, { boundary: kansasFeature, attribution: '&copy; OpenStreetMap' }).addTo(map);
                L.geoJSON(kansasFeature, { style: { color: '#ffd700', weight: 4, fill: false, opacity: 1 } }).addTo(map);

                // Trigger initialization immediately on page load
                initDashboard();
            });

        // ==========================================
        // 2. CSV PARSER & STATION LOADER
        // ==========================================
        var markers = {}; 

        // Helper function to parse CSV text into JavaScript objects
        function parseStationsCsv(csvText) {
            const lines = csvText.trim().split(/\r?\n/);
            const headers = lines[0].split(",").map(item => item.trim());
            
            return lines.slice(1).map(line => {
                const values = line.split(",").map(item => item.trim());
                return Object.fromEntries(
                    headers.map((header, index) => [header, values[index] || ""])
                );
            });
        }
        // Sequential initialization to guarantee GenCast data loads before the map markers
        async function initDashboard() {
            await loadForecastData(); // 1st: Fetch GenCast correlation data
            await loadStationsCSV();  // 2nd: Draw the map with appropriate colors
        }
        
        async function loadStationsCSV() {
            try {
                // Fetch the file from the same directory as this HTML file
                const response = await fetch('stations.csv');
                if (!response.ok) throw new Error("Could not load stations.csv");
                
                const csvText = await response.text();
                const stationList = parseStationsCsv(csvText);
                
                buildStations(stationList);
            } catch (error) {
                console.error("Error loading CSV:", error);
                document.getElementById('station-list').innerHTML = "<li>Error loading stations data.</li>";
            }
        }
        // Global object to store the correlation data
        var forecastData = {}; 
        
        async function loadForecastData() {
            try {
                const response = await fetch('dashboard_data.csv');
                if (!response.ok) throw new Error("Could not load dashboard_data.csv");
                
                const csvText = await response.text();
                const lines = csvText.trim().split(/\r?\n/);
                const headers = lines[0].split(",");
                
                // Map the column indexes dynamically
                const stnIdx = headers.indexOf("Station");
                const obsIdx = headers.indexOf("Mesonet_Temp_C");
                const fcstIdx = headers.indexOf("GenCast_Temp_C");
        
                // Loop through the rows (skipping the header)
                for (let i = 1; i < lines.length; i++) {
                    const row = lines[i].split(",");
                    if (row.length < headers.length) continue; 
                    
                    const station = row[stnIdx];
                    const obsTemp = parseFloat(row[obsIdx]);
                    const fcstTemp = parseFloat(row[fcstIdx]);
        
                    // If this is the first time seeing this station, create its arrays
                    if (!forecastData[station]) {
                        forecastData[station] = { obs: [], fcst: [] };
                    }
                    
                    // Push the temperatures into the station's arrays
                    forecastData[station].obs.push(obsTemp);
                    forecastData[station].fcst.push(fcstTemp);
                }
                console.log("Forecast data loaded for " + Object.keys(forecastData).length + " stations.");
            } catch (error) {
                console.error("Error loading forecast data:", error);
            }
        }
        
        function buildStations(stationList) {
            const listElement = document.getElementById("station-list");
            listElement.innerHTML = ""; 
        
            stationList.sort((a, b) => a.NAME.localeCompare(b.NAME));
        
            stationList.forEach(station => {
                const lat = Number(station.LATITUDE);
                const lon = Number(station.LONGITUDE);
                if (!Number.isFinite(lat) || !Number.isFinite(lon)) return; 
        
                // COLOR LOGIC: Check if GenCast data exists for this specific station
                const hasGenCast = forecastData[station.NAME] && forecastData[station.NAME].obs.length > 0;
                
                // Red if data exists, Dark Grey if missing
                const fillColor = hasGenCast ? "#ff0000" : "#666666"; 
                const borderColor = hasGenCast ? "#ffffff" : "#444444";
                
                var markerStyle = { radius: 6, fillColor: fillColor, color: borderColor, weight: 1.5, opacity: 1, fillOpacity: 0.9 };
        
                var m = L.circleMarker([lat, lon], markerStyle).addTo(map);
                
                // ... (The rest of the bindPopup function remains the same) ...
                const elevationFormat = Number(station.ELEVATION).toFixed(2);
                
                m.bindPopup(
                    '<h3 class="popup-title">' + station.NAME + '</h3>' +
                    '<div class="popup-subtitle">' + station.COUNTY + ' County</div>' +
                    '<b>Elevation:</b> ' + elevationFormat + ' ft <br>' +
                    '<button class="action-btn" style="width:100%; margin-top:10px; padding:5px;" onclick="openGraph(\'' + station.NAME + '\')">📊 View GenCast Correlation</button>'
                );
                
                // Store in dictionary for search indexing
                markers[station.NAME] = {
                    markerObj: m,
                    latLng: L.latLng(lat, lon),
                    data: station
                };

                // Create Sidebar List Item
                const li = document.createElement("li");
                li.innerHTML = `📍 ${station.NAME}`;
                // Using an anonymous function to pass the specific station name safely
                li.onclick = function() { goToStation(station.NAME); };
                listElement.appendChild(li);
            });
        }

        // ==========================================
        // 3. UI FUNCTIONS & NEAREST STATION LOGIC
        // ==========================================
        var currentSearchMarker = null;
        var currentUserGPSPin = null;
        
        function toggleList() {
            var list = document.getElementById("station-list");
            var arrow = document.getElementById("arrow");
            if (list.style.display === "none" || list.style.display === "") {
                list.style.display = "block"; arrow.innerHTML = "▲";
            } else {
                list.style.display = "none"; arrow.innerHTML = "▼";
            }
        }

        function goToStation(name) {
            var stationInfo = markers[name];
            if(stationInfo) {
                map.flyTo(stationInfo.latLng, 11);
                stationInfo.markerObj.openPopup();
            }
        }

        function searchCoordinates() {
            var lat = parseFloat(document.getElementById("input-lat").value);
            var lon = parseFloat(document.getElementById("input-lon").value);
            
            if (!isNaN(lat) && !isNaN(lon)) {
                var searchLatLng = L.latLng(lat, lon);
                var nearestStationId = null;
                var minDistance = Infinity;

                // Mark the searched coordinate location
                if (currentSearchMarker !== null) map.removeLayer(currentSearchMarker);
                currentSearchMarker = L.marker([lat, lon]).addTo(map);

                // Leaflet Nearest-Neighbor algorithm
                for (var stationName in markers) {
                    var stationLatLng = markers[stationName].latLng;
                    var distanceInMeters = map.distance(searchLatLng, stationLatLng);

                    if (distanceInMeters < minDistance) {
                        minDistance = distanceInMeters;
                        nearestStationId = stationName;
                    }
                }

                if (nearestStationId) {
                    var nearestStation = markers[nearestStationId];
                    var distanceKm = (minDistance / 1000).toFixed(1); // Convert to km
                    
                    // Update the popup of the original searched point to point to the nearest station
                    currentSearchMarker.bindPopup(
                        "<b>Searched Location</b><br>" + 
                        "Nearest Station: " + nearestStationId + " (" + distanceKm + " km away)"
                    ).openPopup();

                    // Animate camera to show both the searched point and the nearest station
                    var group = new L.featureGroup([currentSearchMarker, nearestStation.markerObj]);
                    map.flyToBounds(group.getBounds().pad(0.2));
                    
                    // Highlight the actual station with its own popup after a brief delay
                    setTimeout(function() {
                        nearestStation.markerObj.openPopup();
                    }, 1500);
                }
                
            } else {
                alert("Please enter valid numeric latitude and longitude values.");
            }
        }

        function useMyLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    // Inject coordinates into the input fields
                    document.getElementById("input-lat").value = position.coords.latitude.toFixed(6);
                    document.getElementById("input-lon").value = position.coords.longitude.toFixed(6);
                    
                    // Automatically trigger the nearest station search logic
                    searchCoordinates();
                    
                }, function(error) {
                    alert("Unable to access your GPS location. Please check your browser permissions.");
                });
            } else {
                alert("Your browser does not support Geolocation.");
            }
        }
        // NEW FUNCTIONS FOR CORRELATION PLOT
        function closeGraph() {
            document.getElementById("plot-panel").style.display = "none";
        }

        function openGraph(stationName) {
            // NEW: Pan the map to push the marker to the top of the screen
            //if (markers[stationName]) {
                //const latLng = markers[stationName].latLng;
                // Adding ~0.6 to the latitude centers the camera north of the station
                //map.flyTo([latLng.lat + 0.6, latLng.lng], 8); 
            //}
            
            document.getElementById("plot-panel").style.display = "flex";
            document.getElementById("plot-title").textContent = `GenCast vs Mesonet: ${stationName}`;
            
            const plotContainer = document.getElementById("correlation-plot");
            const feedbackText = document.getElementById("plot-feedback"); // Select the feedback div
        
            // IF NO GENCAST DATA EXISTS
            if (!forecastData[stationName] || forecastData[stationName].obs.length === 0) {
                feedbackText.innerHTML = "";
                plotContainer.innerHTML = 
                    "<div style='display:flex; height:100%; align-items:center; justify-content:center; color:#aaa; text-align:center; padding: 20px;'>" +
                    "GenCast predictive model correlation is still being implemented for these coordinates.</div>";
                return; 
            }
        
            // IF DATA EXISTS: Clear previous messages
            plotContainer.innerHTML = ""; 
        
            const mesonetGroundTruth = forecastData[stationName].obs;
            const genCastForecast = forecastData[stationName].fcst;
        
            // METRIC CALCULATION: MAE (Magnitude) and Bias (Direction)
            let sumErrors = 0;
            let sumBias = 0;
            const numPoints = mesonetGroundTruth.length;
        
            for (let i = 0; i < numPoints; i++) {
                let diff = genCastForecast[i] - mesonetGroundTruth[i]; // GenCast minus Mesonet
                sumBias += diff;
                sumErrors += Math.abs(diff);
            }
            
            const mae = (sumErrors / numPoints).toFixed(1);
            const bias = (sumBias / numPoints).toFixed(1);
        
            // DETERMINE THE BIAS DIRECTION TEXT
            let forecastTrendText = "";
            if (bias > 0.3) {
                forecastTrendText = `The model exhibits a warm bias, overpredicting the heat by an average of <b style="color:#ff6b6b;">+${bias} °C</b>.`;
            } else if (bias < -0.3) {
                // Math.abs() removes the negative sign so it reads naturally
                forecastTrendText = `The model exhibits a cool bias, underpredicting the temperature by an average of <b style="color:#4dabf7;">${Math.abs(bias).toFixed(1)} °C</b>.`;
            } else {
                forecastTrendText = `The predictions are well-balanced with no major hot or cold bias.`;
            }
        
            // GENERATE THE BULLETED STATEMENT
            feedbackText.innerHTML = `
                <b>5-Year Historical Performance:</b>
                <ul style="margin-top: 5px; margin-bottom: 0; padding-left: 20px;">
                    <li><b>Average Error:</b> The forecast generally misses the actual ground temperature by <b>${mae} °C</b>.</li>
                    <li><b>Forecast Trend:</b> ${forecastTrendText}</li>
                </ul>
            `;
                
            // CALCULATE RESIDUALS FOR THE HISTOGRAM
            const residuals = [];
            for (let i = 0; i < mesonetGroundTruth.length; i++) {
                residuals.push(mesonetGroundTruth[i] - genCastForecast[i]); // Obs - Forecast
            }

            // CHART 1: SCATTER PLOT
            const trace1 = {
                x: mesonetGroundTruth, 
                y: genCastForecast,
                mode: 'markers', type: 'scatter', name: 'Daily Temp °C',
                marker: { size: 6, color: '#ff4d4d', opacity: 0.6 },
                xaxis: 'x', yaxis: 'y', // Assign to the first subplot (left)
                hovertemplate: 'Mesonet: %{x}°C<br>GenCast: %{y}°C<extra></extra>'
            };
        
            const allTemps = mesonetGroundTruth.concat(genCastForecast);
            const minTemp = Math.min(...allTemps);
            const maxTemp = Math.max(...allTemps);
        
            const trace2 = {
                x: [minTemp, maxTemp], y: [minTemp, maxTemp],
                mode: 'lines', type: 'scatter', name: '1:1 Line',
                line: { dash: 'dash', color: '#aaaaaa' },
                xaxis: 'x', yaxis: 'y' // Assign to the first subplot (left)
            };

            // CHART 2: RESIDUALS HISTOGRAM
            const trace3 = {
                x: residuals,
                type: 'histogram',
                histnorm: 'percent',
                marker: { color: '#5b9bd5', line: { color: '#333333', width: 1 } },
                opacity: 0.8,
                xaxis: 'x2', yaxis: 'y2', // Assign to the second subplot (right)
                name: 'Residuals'
            };
        
            const layout = {
                paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
                font: { color: '#ffffff' }, 
                margin: { t: 20, l: 40, r: 20, b: 40 },
                showlegend: false,
                
                // Scatter Plot Configuration (Left half)
                // domain limits it to the left 42% of the panel
                xaxis:  { title: 'Mesonet Ground Truth (°C)', domain: [0, 0.42], gridcolor: '#444' },
                // scaleanchor and scaleratio force the scatter plot to be PERFECTLY SQUARE (1:1 aspect ratio)
                yaxis:  { title: 'GenCast 10-day Lead (°C)', gridcolor: '#444', scaleanchor: 'x', scaleratio: 1 }, 
                
                // Histogram Configuration (Right half)
                // domain places it from 55% to 100% of the panel, leaving a gap in the middle
                xaxis2: { title: 'Residuals (Obs - Forecast)', domain: [0.55, 1], gridcolor: '#444' },
                yaxis2: { title: 'Percentage (%)', anchor: 'x2', gridcolor: '#444' }
            };
        
            Plotly.newPlot('correlation-plot', [trace1, trace2, trace3], layout, {responsive: true, displayModeBar: false});
        }

        // NEW FUNCTION FOR THE DOWNLOAD BUTTON
        function downloadChart() {
            // Uses Plotly's native tool to export the entire panel as a single high-resolution PNG image
            const plotElement = document.getElementById('correlation-plot');
            Plotly.downloadImage('correlation-plot', {
                format: 'png',
                width: 1000, // Combined rectangular image width
                height: 450, // Image height
                filename: 'GenCast_Correlation_Analysis'
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kansas Mesonet Dashboard</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background-color: #2c2c2c; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        #map { width: 100%; height: 100vh; background-color: #2c2c2c; }
        
        /* Leaflet Popup Styles */
        .leaflet-popup-content-wrapper { background: #1e1e1e; color: #ffffff; border-radius: 8px; border: 1px solid #ff3333; }
        .leaflet-popup-tip { background: #1e1e1e; border: 1px solid #ff3333; }
        .popup-title { color: #ff4d4d; font-size: 16px; margin: 0 0 5px 0; border-bottom: 1px solid #333; padding-bottom: 5px; }

        /* ==========================================
           FLOATING PANELS STYLES
           ========================================== */
        .floating-panel {
            position: absolute;
            z-index: 9999; 
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(5px);
            border: 1px solid #444;
            border-radius: 10px;
            color: #fff;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Panel 1: Title and Station List (Top Left) */
        #title-panel { top: 20px; left: 20px; width: 280px; }
        #title-panel h2 { margin: 0 0 5px 0; font-size: 20px; color: #ffd700; }
        #title-panel p { margin: 0 0 15px 0; font-size: 13px; color: #ccc; }
        
        /* Toggle List Button */
        .toggle-btn {
            background: #333; color: #fff; border: 1px solid #555;
            padding: 8px; width: 100%; border-radius: 5px;
            cursor: pointer; text-align: left; font-weight: bold;
            display: flex; justify-content: space-between;
        }
        .toggle-btn:hover { background: #444; }

        /* Hidden Station List */
        #station-list {
            display: none; 
            list-style: none; padding: 0; margin: 10px 0 0 0;
            max-height: 150px; overflow-y: auto;
        }
        #station-list li { padding: 8px; border-bottom: 1px solid #444; cursor: pointer; font-size: 14px; }
        #station-list li:hover { background: #444; color: #ffd700; }

        /* Panel 2: GPS and Coordinates Search (Top Right) */
        #gps-panel { top: 20px; right: 20px; width: 220px; display: flex; flex-direction: column; gap: 10px; }
        #gps-panel h3 { margin: 0; font-size: 16px; color: #fff; }
        
        .coord-input {
            background: #222; color: #fff; border: 1px solid #555;
            padding: 8px; border-radius: 5px; width: 100%; box-sizing: border-box;
        }
        
        .action-btn {
            background: #ffd700; color: #000; border: none; font-weight: bold;
            padding: 10px; border-radius: 5px; cursor: pointer;
        }
        .action-btn:hover { background: #e6c200; }
        
    </style>
</head>
<body>

    <!-- UI: TITLE & LIST PANEL -->
    <div id="title-panel" class="floating-panel">
        <h2>GenCast Mesonet</h2>
        <p>Select your Mesonet station on the map or expand the list below.</p>
        
        <button class="toggle-btn" onclick="toggleList()">
            Available Stations <span id="arrow">▼</span>
        </button>
        <ul id="station-list">
            <li onclick="goToStation('Manhattan')">📍 Manhattan</li>
            <li onclick="goToStation('Colby')">📍 Colby</li>
            <li onclick="goToStation('Parsons')">📍 Parsons</li>
        </ul>
    </div>

    <!-- UI: SEARCH & GPS PANEL -->
    <div id="gps-panel" class="floating-panel">
        <h3>🔍 Coordinates</h3>
        <input type="text" id="input-lat" class="coord-input" placeholder="Latitude (e.g. 39.2)">
        <input type="text" id="input-lon" class="coord-input" placeholder="Longitude (e.g. -96.5)">
        <button class="action-btn" onclick="searchCoordinates()">Go to Location</button>
        <hr style="border: 0; border-top: 1px solid #555; width: 100%; margin: 5px 0;">
        <button class="action-btn" style="background: #007bff; color: white;" onclick="useMyLocation()">📡 Use my location</button>
    </div>

    <!-- MAP CONTAINER -->
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/aparshin/leaflet-boundary-canvas@master/src/BoundaryCanvas.js"></script>
    
    <script>
        // ==========================================
        // 1. MAP SETUP & CLIPPING
        // ==========================================
        var kansasBounds = [[36.9, -102.1], [40.1, -94.5]];
        
        var map = L.map('map', { 
            center: [38.5, -98.0], 
            zoom: 7, 
            minZoom: 7, 
            maxBounds: kansasBounds, 
            maxBoundsViscosity: 1.0,
            // THE MAGIC FIX: Forces Leaflet to use Canvas instead of SVG.
            // This perfectly solves the circle resizing issue during zoom animations!
            preferCanvas: true 
        });

        // Background dark map
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', { 
            attribution: 'Tiles &copy; Esri', 
            maxZoom: 19 
        }).addTo(map);

        // Kansas polygon clipping
        fetch('https://raw.githubusercontent.com/PublicaMundi/MappingAPI/master/data/geojson/us-states.json')
            .then(response => response.json())
            .then(data => {
                var kansasFeature = data.features.find(f => f.properties.name === 'Kansas');
                var osmUrl = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
                
                L.TileLayer.boundaryCanvas(osmUrl, { boundary: kansasFeature, attribution: '&copy; OpenStreetMap' }).addTo(map);
                L.geoJSON(kansasFeature, { style: { color: '#ffd700', weight: 4, fill: false, opacity: 1 } }).addTo(map);
                
                addStations();
            });

        // ==========================================
        // 2. STATION LOGIC & MARKERS
        // ==========================================
        var markers = {}; 

        function addStations() {
            var markerStyle = { radius: 8, fillColor: "#ff0000", color: "#ffffff", weight: 2, opacity: 1, fillOpacity: 0.9 };
            
            markers['Manhattan'] = L.circleMarker([39.208, -96.592], markerStyle).addTo(map)
                .bindPopup('<h3 class="popup-title">Manhattan Mesonet</h3><b>Temp:</b> 22°C <br><b>Precip:</b> 0.0 mm');

            markers['Colby'] = L.circleMarker([39.395, -101.060], markerStyle).addTo(map)
                .bindPopup('<h3 class="popup-title">Colby Mesonet</h3><b>Temp:</b> 19°C <br><b>Precip:</b> 2.5 mm');

            markers['Parsons'] = L.circleMarker([37.370, -95.280], markerStyle).addTo(map)
                .bindPopup('<h3 class="popup-title">Parsons Mesonet</h3><b>Temp:</b> 25°C <br><b>Precip:</b> 0.0 mm');
        }

        // ==========================================
        // 3. USER INTERFACE (UI) FUNCTIONS
        // ==========================================
        
        // Expand/Collapse the station list
        function toggleList() {
            var list = document.getElementById("station-list");
            var arrow = document.getElementById("arrow");
            if (list.style.display === "none" || list.style.display === "") {
                list.style.display = "block";
                arrow.innerHTML = "▲";
            } else {
                list.style.display = "none";
                arrow.innerHTML = "▼";
            }
        }

        // Fly to station selected from the list
        function goToStation(name) {
            var marker = markers[name];
            if(marker) {
                map.flyTo(marker.getLatLng(), 11);
                marker.openPopup();
            }
        }

        // Fly to user-input coordinates
        function searchCoordinates() {
            var lat = parseFloat(document.getElementById("input-lat").value);
            var lon = parseFloat(document.getElementById("input-lon").value);
            
            if (!isNaN(lat) && !isNaN(lon)) {
                map.flyTo([lat, lon], 12);
                L.marker([lat, lon]).addTo(map).bindPopup("<b>Searched Location:</b><br>" + lat + ", " + lon).openPopup();
            } else {
                alert("Please enter valid numbers for Latitude and Longitude.");
            }
        }

        // Use Native HTML5 Geolocation (GPS)
        function useMyLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    var lat = position.coords.latitude;
                    var lon = position.coords.longitude;
                    
                    map.flyTo([lat, lon], 13);
                    
                    var userPin = L.circleMarker([lat, lon], {
                        radius: 10, fillColor: "#007bff", color: "#ffffff", weight: 3, opacity: 1, fillOpacity: 1
                    }).addTo(map).bindPopup("<b>Your Current Location</b>").openPopup();
                    
                }, function(error) {
                    alert("Unable to access your GPS location. Please check your browser permissions.");
                });
            } else {
                alert("Your browser does not support Geolocation.");
            }
        }
    </script>
</body>
</html>
